# Actualiza data/publications.json (respaldo offline de la lista de publicaciones)
# cada lunes, y también a pedido desde la pestaña Actions → "Run workflow".
# Solo hace commit si el archivo cambió.
name: Actualizar publicaciones

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 09:00 UTC (~06:00 en Chile)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar OpenAlex y regenerar el respaldo
        run: python scripts/update_publications.py

      - name: Commit si hubo cambios
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Actualiza publicaciones desde OpenAlex ($(date -u +%F))"
          git push
